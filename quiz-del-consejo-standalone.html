<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quiz Games</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-deep:#150829;
    --bg-mid:#241147;
    --card:rgba(255,255,255,0.06);
    --card-border:rgba(255,255,255,0.12);
    --text:#F5F2FF;
    --text-dim:#B8AFD9;
    --deportes:#8CFF6B;
    --cultura:#FFC93C;
    --peliculas:#FF4FA3;
    --redes:#34D2FF;
    --danger:#FF5B5B;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{height:100%;}
  body{
    font-family:'Poppins', sans-serif;
    background: radial-gradient(circle at 20% 20%, var(--bg-mid), var(--bg-deep) 60%);
    color:var(--text);
    min-height:100vh;
    overflow-x:hidden;
    position:relative;
  }
  .blob{
    position:fixed;
    border-radius:50%;
    filter:blur(70px);
    opacity:0.35;
    z-index:0;
    animation:float 14s ease-in-out infinite;
    pointer-events:none;
  }
  .blob1{width:340px;height:340px;background:var(--peliculas);top:-100px;left:-100px;animation-delay:0s;}
  .blob2{width:280px;height:280px;background:var(--redes);bottom:-80px;right:-60px;animation-delay:3s;}
  .blob3{width:260px;height:260px;background:var(--deportes);bottom:20%;left:-120px;animation-delay:6s;}
  .blob4{width:220px;height:220px;background:var(--cultura);top:10%;right:-80px;animation-delay:9s;}
  @keyframes float{
    0%,100%{transform:translate(0,0) scale(1);}
    50%{transform:translate(30px,-30px) scale(1.08);}
  }
  #app{
    position:relative;
    z-index:1;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:28px 18px 60px;
  }
  h1,h2,h3{font-family:'Baloo 2', sans-serif;}
  .logo{
    font-family:'Baloo 2', sans-serif;
    font-weight:800;
    font-size:clamp(2.2rem, 7vw, 3.4rem);
    text-align:center;
    letter-spacing:-1px;
    margin-bottom:6px;
    background:linear-gradient(90deg, var(--deportes), var(--cultura), var(--peliculas), var(--redes));
    background-size:300% 100%;
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
    animation:gradientshift 6s ease infinite;
  }
  @keyframes gradientshift{
    0%,100%{background-position:0% 50%;}
    50%{background-position:100% 50%;}
  }
  .tagline{
    text-align:center;
    color:var(--text-dim);
    font-size:1rem;
    margin-bottom:36px;
    font-weight:500;
  }
  .screen{
    width:100%;
    max-width:520px;
    display:flex;
    flex-direction:column;
    gap:18px;
    animation:fadein .35s ease;
  }
  @keyframes fadein{
    from{opacity:0; transform:translateY(10px);}
    to{opacity:1; transform:translateY(0);}
  }
  .card{
    background:var(--card);
    border:1px solid var(--card-border);
    border-radius:24px;
    padding:24px;
    backdrop-filter:blur(14px);
  }
  .btn{
    font-family:'Baloo 2', sans-serif;
    font-weight:700;
    font-size:1.15rem;
    border:none;
    border-radius:18px;
    padding:18px 20px;
    cursor:pointer;
    color:#150829;
    background:linear-gradient(90deg,#8CFF6B,#34D2FF);
    transition:transform .15s ease, box-shadow .15s ease;
    width:100%;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:10px;
  }
  .btn:hover{transform:translateY(-2px) scale(1.015); box-shadow:0 8px 24px rgba(140,255,107,0.25);}
  .btn:active{transform:translateY(0) scale(0.98);}
  .btn.secondary{
    background:rgba(255,255,255,0.08);
    color:var(--text);
    border:1px solid var(--card-border);
  }
  .btn.secondary:hover{box-shadow:0 8px 20px rgba(255,255,255,0.08);}
  .btn:disabled{opacity:.45; cursor:not-allowed; transform:none; box-shadow:none;}

  input[type=text]{
    font-family:'Poppins', sans-serif;
    font-size:1.05rem;
    padding:16px 18px;
    border-radius:16px;
    border:1px solid var(--card-border);
    background:rgba(255,255,255,0.05);
    color:var(--text);
    width:100%;
    outline:none;
    letter-spacing:1px;
  }
  input[type=text]:focus{border-color:var(--redes);}
  input[type=text]::placeholder{color:var(--text-dim);}
  label.field-label{font-size:.8rem; color:var(--text-dim); font-weight:600; text-transform:uppercase; letter-spacing:1px; margin-bottom:8px; display:block;}

  .cat-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:14px;
  }
  .cat-card{
    border-radius:20px;
    padding:20px 14px;
    cursor:pointer;
    border:2px solid transparent;
    text-align:center;
    transition:transform .15s ease, border-color .15s ease;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:8px;
    font-family:'Baloo 2', sans-serif;
    font-weight:700;
    font-size:1.05rem;
  }
  .cat-card:hover{transform:translateY(-4px);}
  .cat-card .emoji{font-size:2.2rem;}
  .cat-deportes{background:linear-gradient(160deg, rgba(140,255,107,0.25), rgba(140,255,107,0.08)); color:var(--deportes);}
  .cat-cultura{background:linear-gradient(160deg, rgba(255,201,60,0.25), rgba(255,201,60,0.08)); color:var(--cultura);}
  .cat-peliculas{background:linear-gradient(160deg, rgba(255,79,163,0.25), rgba(255,79,163,0.08)); color:var(--peliculas);}
  .cat-redes{background:linear-gradient(160deg, rgba(52,210,255,0.25), rgba(52,210,255,0.08)); color:var(--redes);}

  .count-grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:12px;
  }
  .count-card{
    border-radius:16px;
    padding:18px 8px;
    text-align:center;
    cursor:pointer;
    border:2px solid var(--card-border);
    background:rgba(255,255,255,0.04);
    font-family:'Baloo 2', sans-serif;
    font-weight:800;
    font-size:1.3rem;
    transition:all .15s ease;
  }
  .count-card:hover{border-color:var(--redes); transform:translateY(-3px);}
  .count-card .sub{display:block; font-family:'Poppins'; font-weight:500; font-size:.68rem; color:var(--text-dim); margin-top:2px; text-transform:uppercase; letter-spacing:.5px;}

  .pill{
    display:inline-flex;
    align-items:center;
    gap:6px;
    padding:6px 14px;
    border-radius:999px;
    font-size:.78rem;
    font-weight:700;
    text-transform:uppercase;
    letter-spacing:.6px;
  }
  .topbar{
    width:100%; max-width:520px;
    display:flex; justify-content:space-between; align-items:center;
    margin-bottom:6px;
  }
  .back{
    background:none; border:none; color:var(--text-dim); cursor:pointer;
    font-family:'Poppins'; font-weight:600; font-size:.9rem;
    display:flex; align-items:center; gap:4px;
  }
  .back:hover{color:var(--text);}

  .hud{
    display:flex; justify-content:space-between; align-items:center;
    margin-bottom:4px;
  }
  .hud .score{font-family:'Baloo 2'; font-weight:800; font-size:1.3rem;}
  .timer-wrap{
    width:100%; height:10px; background:rgba(255,255,255,0.08); border-radius:999px; overflow:hidden; margin-bottom:6px;
  }
  .timer-bar{
    height:100%; border-radius:999px;
    background:linear-gradient(90deg,var(--deportes),var(--cultura));
    transition:width .2s linear;
  }
  .qcount{color:var(--text-dim); font-size:.85rem; font-weight:600;}

  .question-text{
    font-family:'Baloo 2'; font-weight:700; font-size:1.35rem; line-height:1.35; margin:14px 0 6px;
  }
  .options{display:flex; flex-direction:column; gap:12px; margin-top:10px;}
  .option{
    text-align:left;
    padding:16px 18px;
    border-radius:16px;
    border:2px solid var(--card-border);
    background:rgba(255,255,255,0.04);
    color:var(--text);
    font-family:'Poppins'; font-weight:600; font-size:1rem;
    cursor:pointer;
    transition:all .15s ease;
    display:flex; align-items:center; gap:12px;
  }
  .option .letter{
    width:28px; height:28px; border-radius:8px; background:rgba(255,255,255,0.08);
    display:flex; align-items:center; justify-content:center; font-size:.85rem; font-weight:800; flex-shrink:0;
  }
  .option:hover:not(.locked){border-color:var(--redes); transform:translateX(3px);}
  .option.correct{background:rgba(140,255,107,0.18); border-color:var(--deportes);}
  .option.wrong{background:rgba(255,91,91,0.18); border-color:var(--danger);}
  .option.locked{cursor:default;}

  .streak{
    display:flex; align-items:center; gap:6px; color:var(--cultura); font-weight:700; font-size:.9rem;
  }
  .points-toast{
    text-align:center; font-family:'Baloo 2'; font-weight:800; font-size:1.1rem; color:var(--deportes);
  }

  .player-row{
    display:flex; align-items:center; justify-content:space-between;
    padding:12px 16px; border-radius:14px; background:rgba(255,255,255,0.04); margin-bottom:8px;
  }
  .player-row .name{font-weight:600; display:flex; align-items:center; gap:8px;}
  .player-row .avatar{
    width:32px; height:32px; border-radius:50%; display:flex; align-items:center; justify-content:center;
    font-weight:800; font-size:.85rem; color:#150829;
  }
  .player-row .pts{font-family:'Baloo 2'; font-weight:800;}

  .rank-1{background:linear-gradient(135deg,#FFD86B,#FF9B3C);}
  .rank-2{background:linear-gradient(135deg,#E0E0E0,#A9A9C7);}
  .rank-3{background:linear-gradient(135deg,#E0A65B,#B5722C);}

  .code-display{
    font-family:'Baloo 2'; font-weight:800; font-size:2.4rem; text-align:center;
    letter-spacing:10px; background:rgba(255,255,255,0.06); border-radius:18px; padding:18px 10px;
    border:2px dashed var(--card-border);
  }

  .muted{color:var(--text-dim); font-size:.9rem;}
  .center{text-align:center;}

  .result-emoji{font-size:4rem; text-align:center; margin-bottom:4px;}

  footer.foot{
    margin-top:40px; color:var(--text-dim); font-size:.8rem; text-align:center;
  }

  ::-webkit-scrollbar{width:8px;}
  ::-webkit-scrollbar-thumb{background:rgba(255,255,255,0.15); border-radius:8px;}

  .confetti-piece{
    position:fixed; top:-10px; width:9px; height:14px; z-index:50; pointer-events:none;
    animation:fall linear forwards;
  }
  @keyframes fall{
    to{transform:translateY(110vh) rotate(540deg); opacity:0.3;}
  }

  @media (max-width:420px){
    .code-display{font-size:1.9rem; letter-spacing:6px;}
    .count-grid{grid-template-columns:repeat(3,1fr); gap:8px;}
  }

  @media (prefers-reduced-motion: reduce){
    .blob, .logo{animation:none;}
  }
</style>
</head>

<div id="app"></div>

<script>
/* ---------------------------------------------------------
   ALMACENAMIENTO PROPIO (Firebase Realtime Database)
   Reemplaza el "window.storage" especial de claude.ai por una
   base de datos real, para que la sala funcione en cualquier
   sitio donde subas este archivo.

   PASOS PARA CONFIGURAR (una sola vez, gratis):
   1. Entra a https://console.firebase.google.com/ e inicia sesión
      con tu cuenta de Google.
   2. Crea un proyecto nuevo (el nombre no importa).
   3. En el menú izquierdo: Build > Realtime Database > Create Database.
      - Elige cualquier región.
      - Cuando pregunte por las reglas, elige "Start in test mode".
   4. Ya creada, ve a la pestaña "Rules" y reemplaza el contenido por:
        {
          "rules": {
            ".read": true,
            ".write": true
          }
        }
      Dale a "Publish". (Esto hace la base de datos pública para
      cualquiera que tenga el link — está bien para un juego entre
      amigos, pero NUNCA metas ahí datos sensibles.)
   5. Copia la "Database URL" que aparece arriba de los datos
      (algo como https://tu-proyecto-default-rtdb.firebaseio.com)
      y pégala abajo reemplazando FIREBASE_URL.
   6. Sube este archivo .html a donde quieras (GitHub Pages, Netlify,
      Vercel, tu hosting, o ábrelo directo doble clic) y listo.
--------------------------------------------------------- */
const FIREBASE_URL = "https://el-consejo-b382c-default-rtdb.firebaseio.com";

window.storage = (function(){
  function checkConfigured(){
    if(!FIREBASE_URL || FIREBASE_URL.indexOf('PON_AQUI') !== -1){
      throw new Error('Falta configurar FIREBASE_URL al inicio del archivo. Revisa las instrucciones en el código.');
    }
  }
  function path(key){
    return FIREBASE_URL.replace(/\/$/,'') + '/store/' + encodeURIComponent(key) + '.json';
  }
  return {
    async set(key, value, shared){
      checkConfigured();
      const res = await fetch(path(key), { method:'PUT', body: JSON.stringify(value) });
      if(!res.ok) throw new Error('Error guardando (' + res.status + '): ' + await res.text());
      return { key, value, shared: !!shared };
    },
    async get(key, shared){
      checkConfigured();
      const res = await fetch(path(key));
      if(!res.ok) throw new Error('Error leyendo (' + res.status + '): ' + await res.text());
      const value = await res.json();
      if(value === null) return null;
      return { key, value, shared: !!shared };
    },
    async delete(key, shared){
      checkConfigured();
      const res = await fetch(path(key), { method:'DELETE' });
      if(!res.ok) throw new Error('Error borrando (' + res.status + '): ' + await res.text());
      return { key, deleted:true, shared: !!shared };
    },
    async list(prefix, shared){
      checkConfigured();
      const res = await fetch(FIREBASE_URL.replace(/\/$/,'') + '/store.json');
      if(!res.ok) throw new Error('Error listando (' + res.status + '): ' + await res.text());
      const all = await res.json() || {};
      const keys = Object.keys(all)
        .map(k => decodeURIComponent(k))
        .filter(k => !prefix || k.startsWith(prefix));
      return { keys, prefix, shared: !!shared };
    }
  };
})();

const QUESTION_TIME = 10; // segundos por pregunta
const COUNT_OPTIONS = [5,10,15,20,30];
const AVATAR_COLORS = ["#8CFF6B","#FFC93C","#FF4FA3","#34D2FF","#B98CFF","#FF8C5B"];

function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]] = [a[j],a[i]];
  }
  return a;
}
function randCode(){
  const chars = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
  let s = "";
  for(let i=0;i<5;i++) s += chars[Math.floor(Math.random()*chars.length)];
  return s;
}
function uid(){
  return 'p' + Math.random().toString(36).slice(2,10);
}
function colorFor(id){
  let h = 0;
  for(let i=0;i<id.length;i++) h = (h*31 + id.charCodeAt(i)) % AVATAR_COLORS.length;
  return AVATAR_COLORS[Math.abs(h)];
}
function initials(name){
  return (name || "?").trim().slice(0,2).toUpperCase();
}
function pool(catKey, subKey){
  return CATEGORIES[catKey].subcategories[subKey].questions;
}
function pointsForAnswer(correct, elapsedSeconds){
  if(!correct) return 0;
  const clamped = Math.max(0, Math.min(elapsedSeconds, QUESTION_TIME));
  const speedRatio = 1 - (clamped/QUESTION_TIME);
  return Math.round(500 + speedRatio*500);
}

function render(){
  app.innerHTML = '';
  const screens = {
    home: renderHome,
    soloCategory: renderSoloCategory,
    soloSubcategory: ()=>renderSubcategoryScreen('solo'),
    soloCount: ()=>renderCountScreen('solo'),
    soloGame: renderSoloGame,
    soloResults: renderSoloResults,
    roomChoice: renderRoomChoice,
    roomCreateCategory: renderRoomCreateCategory,
    roomSubcategory: ()=>renderSubcategoryScreen('room'),
    roomCount: ()=>renderCountScreen('room'),
    roomJoin: renderRoomJoin,
    roomLobby: renderRoomLobby,
    roomGame: renderRoomGame,
    roomResults: renderRoomResults
  };
  const fn = screens[state.screen] || renderHome;
  fn();
}

function el(tag, cls, html){
  const e = document.createElement(tag);
  if(cls) e.className = cls;
  if(html !== undefined) e.innerHTML = html;
  return e;
}

function goHome(){
  stopPolling();
  Object.assign(state, {
    screen:'home', mode:null, pendingCategory:null, pendingSubKey:null,
    soloCategory:null, soloSubKey:null, soloIdx:0, soloScore:0, soloStreak:0, soloAnswered:false,
    soloQuestions:[], roomCode:null, isHost:false, roomMeta:null, roomPlayers:[], myAnswered:false
  });
  render();
}

function renderHome(){
  const wrap = el('div','screen');
  wrap.appendChild(el('div','logo','🎮 Quiz Games'));
  wrap.appendChild(el('div','tagline','Ponte a prueba solo o reta a tus amigos en vivo'));

  const card = el('div','card');
  const label = el('label','field-label','Tu nombre de jugador');
  card.appendChild(label);
  const input = el('input');
  input.type='text';
  input.placeholder='Ej. CraqueDelBarrio';
  input.maxLength = 16;
  input.value = state.myName;
  input.addEventListener('input', e => state.myName = e.target.value);
  card.appendChild(input);
  wrap.appendChild(card);

  const soloBtn = el('button','btn','🎯 Jugar solo');
  soloBtn.addEventListener('click', ()=>{ state.screen='soloCategory'; render(); });
  wrap.appendChild(soloBtn);

  const roomBtn = el('button','btn secondary','🟢 Jugar con amigos online');
  roomBtn.addEventListener('click', ()=>{
    if(!state.myName.trim()){ shake(input); return; }
    state.screen='roomChoice'; render();
  });
  wrap.appendChild(roomBtn);

  const foot = el('footer','foot','Deportes (Fútbol · Béisbol · Baloncesto · Boxeo · WWE) · Cultura General · Películas · Redes Sociales');
  app.appendChild(wrap);
  app.appendChild(foot);
}

function shake(elm){
  elm.style.borderColor = 'var(--danger)';
  elm.animate([{transform:'translateX(0)'},{transform:'translateX(-6px)'},{transform:'translateX(6px)'},{transform:'translateX(0)'}], {duration:300});
  setTimeout(()=> elm.style.borderColor = '', 800);
}

function categoryGrid(onPick){
  const grid = el('div','cat-grid');
  Object.entries(CATEGORIES).forEach(([key,cat])=>{
    const c = el('div', 'cat-card '+cat.css);
    c.appendChild(el('div','emoji',cat.emoji));
    c.appendChild(el('div','',cat.label));
    c.addEventListener('click', ()=> onPick(key));
    grid.appendChild(c);
  });
  return grid;
}

function topBar(onBack){
  const bar = el('div','topbar');
  const b = el('button','back','← Salir');
  b.addEventListener('click', onBack);
  bar.appendChild(b);
  bar.appendChild(el('div','pill',''));
  return bar;
}

/* ---------------------------------------------------------
   Flujo compartido: categoria -> subcategoria -> cantidad
--------------------------------------------------------- */
function pickCategory(mode, catKey){
  state.mode = mode;
  state.pendingCategory = catKey;
  const subKeys = Object.keys(CATEGORIES[catKey].subcategories);
  if(subKeys.length > 1){
    state.screen = mode==='solo' ? 'soloSubcategory' : 'roomSubcategory';
  } else {
    state.pendingSubKey = subKeys[0];
    state.screen = mode==='solo' ? 'soloCount' : 'roomCount';
  }
  render();
}

function renderSubcategoryScreen(mode){
  const backScreen = mode==='solo' ? 'soloCategory' : 'roomCreateCategory';
  app.appendChild(topBar(()=>{ state.screen=backScreen; render(); }));
  const wrap = el('div','screen');
  const cat = CATEGORIES[state.pendingCategory];
  wrap.appendChild(el('h2','', cat.emoji+' Elige la disciplina'));
  wrap.appendChild(el('div','muted','Categoría: '+cat.label));
  const grid = el('div','cat-grid');
  Object.entries(cat.subcategories).forEach(([subKey,sub])=>{
    const c = el('div','cat-card '+cat.css);
    c.appendChild(el('div','emoji',sub.emoji));
    c.appendChild(el('div','',sub.label));
    c.appendChild(el('div','muted', sub.questions.length+' preguntas'));
    c.addEventListener('click', ()=>{
      state.pendingSubKey = subKey;
      state.screen = mode==='solo' ? 'soloCount' : 'roomCount';
      render();
    });
    grid.appendChild(c);
  });
  wrap.appendChild(grid);
  app.appendChild(wrap);
}

function renderCountScreen(mode){
  const cat = CATEGORIES[state.pendingCategory];
  const sub = cat.subcategories[state.pendingSubKey];
  const subKeys = Object.keys(cat.subcategories);
  const backScreen = mode==='solo'
    ? (subKeys.length>1 ? 'soloSubcategory' : 'soloCategory')
    : (subKeys.length>1 ? 'roomSubcategory' : 'roomCreateCategory');
  app.appendChild(topBar(()=>{ state.screen=backScreen; render(); }));
  const wrap = el('div','screen');
  wrap.appendChild(el('h2','','¿Cuántas preguntas?'));
  const pillWrap = el('div','pill', sub.emoji+' '+sub.label);
  pillWrap.style.background='rgba(255,255,255,0.08)';
  pillWrap.style.color=cat.color;
  pillWrap.style.alignSelf='flex-start';
  wrap.appendChild(pillWrap);
  wrap.appendChild(el('div','muted','Elige el largo de la partida ('+sub.questions.length+' preguntas disponibles en el banco)'));

  const grid = el('div','count-grid');
  const opts = COUNT_OPTIONS.filter(n => n <= sub.questions.length);
  opts.forEach(n=>{
    const c = el('div','count-card', n + '<span class="sub">preguntas</span>');
    c.addEventListener('click', ()=> confirmCount(mode, n));
    grid.appendChild(c);
  });
  const allCard = el('div','count-card', sub.questions.length + '<span class="sub">todas</span>');
  allCard.addEventListener('click', ()=> confirmCount(mode, sub.questions.length));
  grid.appendChild(allCard);
  wrap.appendChild(grid);
  app.appendChild(wrap);
}

async function confirmCount(mode, count){
  if(mode==='solo'){
    state.soloCategory = state.pendingCategory;
    state.soloSubKey = state.pendingSubKey;
    state.soloQuestions = shuffle(pool(state.pendingCategory, state.pendingSubKey)).slice(0,count);
    state.soloIdx = 0;
    state.soloScore = 0;
    state.soloStreak = 0;
    state.soloAnswered = false;
    state.screen = 'soloGame';
    render();
  } else {
    await createRoom(state.pendingCategory, state.pendingSubKey, count);
  }
}

/* ---------------------------------------------------------
   SOLO MODE
--------------------------------------------------------- */
function renderSoloCategory(){
  app.appendChild(topBar(goHome));
  const wrap = el('div','screen');
  wrap.appendChild(el('h2','','Elige una categoría'));
  wrap.appendChild(el('div','muted', QUESTION_TIME + 's por pregunta · más puntos si respondes rápido'));
  wrap.appendChild(categoryGrid((key)=> pickCategory('solo', key)));
  app.appendChild(wrap);
}

let soloTimerInterval = null;
function renderSoloGame(){
  clearInterval(soloTimerInterval);
  const cat = CATEGORIES[state.soloCategory];
  const sub = cat.subcategories[state.soloSubKey];
  const q = state.soloQuestions[state.soloIdx];

  app.appendChild(topBar(goHome));
  const wrap = el('div','screen');

  const hud = el('div','hud');
  hud.appendChild(el('div','score','⭐ ' + state.soloScore));
  const streak = el('div','streak', state.soloStreak>1 ? ('🔥 Racha x'+state.soloStreak) : '');
  hud.appendChild(streak);
  hud.appendChild(el('div','qcount', (state.soloIdx+1) + ' / ' + state.soloQuestions.length));
  wrap.appendChild(hud);

  const timerWrap = el('div','timer-wrap');
  const timerBar = el('div','timer-bar');
  timerWrap.appendChild(timerBar);
  wrap.appendChild(timerWrap);

  const card = el('div','card');
  const catPill = el('div','pill', sub.emoji+' '+sub.label);
  catPill.style.background = 'rgba(255,255,255,0.08)';
  catPill.style.color = cat.color;
  card.appendChild(catPill);
  card.appendChild(el('div','question-text', q.q));

  const opts = el('div','options');
  const letters = ['A','B','C','D'];
  q.opts.forEach((optText, i)=>{
    const o = el('button','option');
    const letter = el('div','letter', letters[i]);
    o.appendChild(letter);
    o.appendChild(el('span','', optText));
    o.addEventListener('click', ()=> soloAnswer(i, opts, timerBar));
    opts.appendChild(o);
  });
  card.appendChild(opts);
  wrap.appendChild(card);
  app.appendChild(wrap);

  state.soloAnswered = false;
  state.soloQStart = Date.now();
  let timeLeft = QUESTION_TIME;
  timerBar.style.width = '100%';
  soloTimerInterval = setInterval(()=>{
    timeLeft -= 0.1;
    const pct = Math.max(0, (timeLeft/QUESTION_TIME)*100);
    timerBar.style.width = pct + '%';
    if(timeLeft<=0){
      clearInterval(soloTimerInterval);
      if(!state.soloAnswered) soloAnswer(-1, opts, timerBar);
    }
  }, 100);
}

function soloAnswer(choice, optsEl, timerBar){
  if(state.soloAnswered) return;
  state.soloAnswered = true;
  clearInterval(soloTimerInterval);
  const q = state.soloQuestions[state.soloIdx];
  const elapsed = (Date.now() - state.soloQStart)/1000;
  const buttons = optsEl.querySelectorAll('.option');
  buttons.forEach((b,i)=>{
    b.classList.add('locked');
    if(i===q.a) b.classList.add('correct');
    else if(i===choice) b.classList.add('wrong');
  });
  const correct = choice===q.a;
  const pts = pointsForAnswer(correct, elapsed);
  if(correct){
    state.soloStreak++;
    state.soloScore += pts;
    burstConfetti();
  } else {
    state.soloStreak = 0;
  }
  setTimeout(()=>{
    if(state.soloIdx < state.soloQuestions.length-1){
      state.soloIdx++;
      render();
    } else {
      state.screen = 'soloResults';
      render();
    }
  }, 1100);
}

function renderSoloResults(){
  clearInterval(soloTimerInterval);
  const wrap = el('div','screen');
  const total = state.soloQuestions.length;
  const maxScore = total*1000;
  const fraction = state.soloScore / maxScore;
  let emoji = '👍';
  let msg = '¡Buen intento!';
  if(fraction >= 0.85){ emoji='🏆'; msg='¡Eres una leyenda del quiz!'; }
  else if(fraction >= 0.65){ emoji='🔥'; msg='¡Impresionante!'; }
  else if(fraction >= 0.4){ emoji='🙂'; msg='¡Nada mal!'; }
  else { emoji='😅'; msg='¡A seguir practicando!'; }

  wrap.appendChild(el('div','result-emoji', emoji));
  wrap.appendChild(el('h2','center', msg));
  const card = el('div','card center');
  card.appendChild(el('div','muted','Puntaje final'));
  card.appendChild(el('div','', '<span style="font-family:\'Baloo 2\';font-weight:800;font-size:2.4rem;">'+state.soloScore+'</span> pts'));
  wrap.appendChild(card);

  const again = el('button','btn','🔁 Jugar otra categoría');
  again.addEventListener('click', ()=>{ state.screen='soloCategory'; render(); });
  wrap.appendChild(again);

  const home = el('button','btn secondary','🏠 Volver al inicio');
  home.addEventListener('click', goHome);
  wrap.appendChild(home);

  app.appendChild(wrap);
  burstConfetti();
}

/* ---------------------------------------------------------
   ROOM MODE (multijugador online vía almacenamiento compartido)
--------------------------------------------------------- */
function renderRoomChoice(){
  app.appendChild(topBar(goHome));
  const wrap = el('div','screen');
  wrap.appendChild(el('h2','','Jugar con amigos'));
  wrap.appendChild(el('div','muted','Crea una sala y comparte el código, o únete con uno'));

  const createBtn = el('button','btn','➕ Crear una sala');
  createBtn.addEventListener('click', ()=>{ state.screen='roomCreateCategory'; render(); });
  wrap.appendChild(createBtn);

  const joinBtn = el('button','btn secondary','🔑 Unirme con un código');
  joinBtn.addEventListener('click', ()=>{ state.screen='roomJoin'; render(); });
  wrap.appendChild(joinBtn);

  app.appendChild(wrap);
}

function renderRoomCreateCategory(){
  app.appendChild(topBar(()=>{ state.screen='roomChoice'; render(); }));
  const wrap = el('div','screen');
  wrap.appendChild(el('h2','','Elige la categoría de la sala'));
  wrap.appendChild(categoryGrid((key)=> pickCategory('room', key)));
  app.appendChild(wrap);
}

async function createRoom(categoryKey, subKey, count){
  const code = randCode();
  const questions = shuffle(pool(categoryKey, subKey)).slice(0, count);
  const meta = {
    code, category: categoryKey, subcategory: subKey, status: 'lobby',
    currentQuestion: -1, questionStartTime: null, questions,
    hostId: state.myId, createdAt: Date.now()
  };
  if(!window.storage){
    alert('El almacenamiento multijugador no está disponible en este entorno. Abre el juego como Artifact dentro de claude.ai (no como archivo .html suelto) para poder crear salas.');
    return;
  }
  try{
    await window.storage.set('room:'+code+':meta', JSON.stringify(meta), true);
    await window.storage.set('room:'+code+':players:'+state.myId, JSON.stringify({id:state.myId, name:state.myName, score:0}), true);
  }catch(e){ console.error('createRoom error:', e); alert('No se pudo crear la sala: ' + (e && e.message ? e.message : e)); return; }

  state.roomCode = code;
  state.isHost = true;
  state.roomMeta = meta;
  state.screen = 'roomLobby';
  render();
  startPolling();
}

function renderRoomJoin(){
  app.appendChild(topBar(()=>{ state.screen='roomChoice'; render(); }));
  const wrap = el('div','screen');
  wrap.appendChild(el('h2','','Unirme a una sala'));
  const card = el('div','card');
  card.appendChild(el('label','field-label','Código de sala'));
  const input = el('input');
  input.type='text'; input.placeholder='EJ. AB12C'; input.maxLength=5;
  input.style.textTransform='uppercase';
  input.style.letterSpacing='4px';
  input.style.fontFamily = "'Baloo 2', sans-serif";
  input.style.fontWeight = '700';
  card.appendChild(input);
  wrap.appendChild(card);

  const joinBtn = el('button','btn','Entrar a la sala →');
  joinBtn.addEventListener('click', ()=> joinRoom(input.value.trim().toUpperCase()));
  wrap.appendChild(joinBtn);
  app.appendChild(wrap);
  setTimeout(()=>input.focus(),50);
}

async function joinRoom(code){
  if(!code || code.length<3) return;
  if(!window.storage){
    alert('El almacenamiento multijugador no está disponible en este entorno. Abre el juego como Artifact dentro de claude.ai (no como archivo .html suelto) para poder unirte a salas.');
    return;
  }
  let metaRes;
  try{
    metaRes = await window.storage.get('room:'+code+':meta', true);
  }catch(e){ console.error('joinRoom get error:', e); alert('No encontramos esa sala. Revisa el código. (' + (e && e.message ? e.message : e) + ')'); return; }
  if(!metaRes){ alert('No encontramos esa sala. Revisa el código.'); return; }
  const meta = JSON.parse(metaRes.value);
  try{
    await window.storage.set('room:'+code+':players:'+state.myId, JSON.stringify({id:state.myId, name:state.myName, score:0}), true);
  }catch(e){ console.error('joinRoom set error:', e); alert('No se pudo unir a la sala: ' + (e && e.message ? e.message : e)); return; }

  state.roomCode = code;
  state.isHost = (meta.hostId === state.myId);
  state.roomMeta = meta;
  state.screen = meta.status === 'lobby' ? 'roomLobby' : (meta.status === 'finished' ? 'roomResults' : 'roomGame');
  render();
  startPolling();
}

function stopPolling(){
  if(state.pollTimer){ clearInterval(state.pollTimer); state.pollTimer = null; }
}

function startPolling(){
  stopPolling();
  state.pollTimer = setInterval(pollRoom, 1500);
  pollRoom();
}

async function pollRoom(){
  if(!state.roomCode) return;
  try{
    const metaRes = await window.storage.get('room:'+state.roomCode+':meta', true);
    if(!metaRes) return;
    const meta = JSON.parse(metaRes.value);
    const listRes = await window.storage.list('room:'+state.roomCode+':players:', true);
    let players = [];
    if(listRes && listRes.keys){
      const gets = await Promise.all(listRes.keys.map(k => window.storage.get(k, true).catch(()=>null)));
      players = gets.filter(Boolean).map(r => JSON.parse(r.value));
    }
    players.sort((a,b)=> b.score - a.score);
    state.roomMeta = meta;
    state.roomPlayers = players;

    const targetScreen = meta.status === 'lobby' ? 'roomLobby' : (meta.status === 'finished' ? 'roomResults' : 'roomGame');
    let needsFullRender = true;
    if(state.screen !== targetScreen){
      state.screen = targetScreen;
      state.myAnswered = false;
      state.qStartLocal = meta.questionStartTime;
    } else if(state.screen === 'roomGame'){
      if(state.qStartLocal !== meta.questionStartTime){
        state.qStartLocal = meta.questionStartTime;
        state.myAnswered = false;
      } else {
        needsFullRender = false;
      }
    }
    if(needsFullRender){
      render();
    } else {
      updateRoomGameLive();
    }

    if(state.isHost) hostGameLoop(meta);
  }catch(e){ /* red intermitente: ignorar este ciclo */ }
}

function hostGameLoop(meta){
  if(meta.status !== 'playing') return;
  if(state.advancing) return;
  const elapsed = (Date.now() - meta.questionStartTime)/1000;
  const players = state.roomPlayers;
  const allAnswered = players.length > 0 && players.every(p => p.answeredQ === meta.currentQuestion);
  const minRevealTime = 1.5; // segundos para mostrar respuesta correcta antes de pasar
  if((allAnswered && elapsed >= minRevealTime) || elapsed >= QUESTION_TIME + 1.5){
    state.advancing = true;
    advanceRoomQuestion(meta).finally(()=>{ state.advancing = false; });
  }
}

async function advanceRoomQuestion(meta){
  const next = meta.currentQuestion + 1;
  let newMeta;
  if(next >= meta.questions.length){
    newMeta = {...meta, status:'finished'};
  } else {
    newMeta = {...meta, currentQuestion: next, questionStartTime: Date.now(), status:'playing'};
  }
  try{
    await window.storage.set('room:'+state.roomCode+':meta', JSON.stringify(newMeta), true);
  }catch(e){ /* ignore */ }
}

function renderRoomLobby(){
  const wrap = el('div','screen');
  const cat = CATEGORIES[state.roomMeta.category];
  const sub = cat.subcategories[state.roomMeta.subcategory];

  wrap.appendChild(el('div','tagline','Sala de espera'));
  wrap.appendChild(el('div','code-display', state.roomCode));
  const share = el('div','muted','Comparte este código con tus amigos para que se unan');
  share.style.textAlign='center';
  wrap.appendChild(share);

  const pillRow = el('div','');
  pillRow.style.display='flex';
  pillRow.style.gap='8px';
  pillRow.style.justifyContent='center';
  pillRow.style.flexWrap='wrap';
  const catPill = el('div','pill', sub.emoji+' '+sub.label);
  catPill.style.background='rgba(255,255,255,0.08)';
  catPill.style.color = cat.color;
  const countPill = el('div','pill', '🔢 '+state.roomMeta.questions.length+' preguntas');
  countPill.style.background='rgba(255,255,255,0.08)';
  countPill.style.color = 'var(--text)';
  pillRow.appendChild(catPill);
  pillRow.appendChild(countPill);
  wrap.appendChild(pillRow);

  const card = el('div','card');
  card.appendChild(el('h3','', 'Jugadores ('+state.roomPlayers.length+')'));
  const list = el('div','');
  list.style.marginTop='10px';
  if(state.roomPlayers.length===0){
    list.appendChild(el('div','muted','Esperando jugadores…'));
  } else {
    state.roomPlayers.forEach(p=>{
      const row = el('div','player-row');
      const nameWrap = el('div','name');
      const av = el('div','avatar', initials(p.name));
      av.style.background = colorFor(p.id);
      nameWrap.appendChild(av);
      nameWrap.appendChild(document.createTextNode(p.name + (p.id===state.roomMeta.hostId ? ' 👑' : '')));
      row.appendChild(nameWrap);
      list.appendChild(row);
    });
  }
  card.appendChild(list);
  wrap.appendChild(card);

  if(state.isHost){
    const startBtn = el('button','btn','▶️ Iniciar partida');
    startBtn.disabled = state.roomPlayers.length < 1;
    startBtn.addEventListener('click', async ()=>{
      const newMeta = {...state.roomMeta, status:'playing', currentQuestion:0, questionStartTime:Date.now()};
      await window.storage.set('room:'+state.roomCode+':meta', JSON.stringify(newMeta), true);
      pollRoom();
    });
    wrap.appendChild(startBtn);
  } else {
    wrap.appendChild(el('div','muted','Esperando a que el anfitrión inicie la partida…'));
  }

  const leave = el('button','btn secondary','Salir de la sala');
  leave.addEventListener('click', goHome);
  wrap.appendChild(leave);

  app.appendChild(wrap);
}

let roomTimerRAF = null;
let roomGameHudScoreEl = null;
let roomGameLeaderboardEl = null;
function renderRoomGame(){
  if(roomTimerRAF) cancelAnimationFrame(roomTimerRAF);
  const meta = state.roomMeta;
  const cat = CATEGORIES[meta.category];
  const sub = cat.subcategories[meta.subcategory];
  const q = meta.questions[meta.currentQuestion];
  const me = state.roomPlayers.find(p=>p.id===state.myId) || {score:0};

  const wrap = el('div','screen');
  const hud = el('div','hud');
  const scoreEl = el('div','score','⭐ ' + me.score);
  hud.appendChild(scoreEl);
  hud.appendChild(el('div','qcount', (meta.currentQuestion+1) + ' / ' + meta.questions.length));
  wrap.appendChild(hud);
  roomGameHudScoreEl = scoreEl;

  const timerWrap = el('div','timer-wrap');
  const timerBar = el('div','timer-bar');
  timerWrap.appendChild(timerBar);
  wrap.appendChild(timerWrap);

  const card = el('div','card');
  const catPill = el('div','pill', sub.emoji+' '+sub.label);
  catPill.style.background='rgba(255,255,255,0.08)';
  catPill.style.color = cat.color;
  card.appendChild(catPill);
  card.appendChild(el('div','question-text', q.q));

  const opts = el('div','options');
  const letters = ['A','B','C','D'];
  q.opts.forEach((optText,i)=>{
    const o = el('button','option');
    o.appendChild(el('div','letter', letters[i]));
    o.appendChild(el('span','', optText));
    if(state.myAnswered) o.classList.add('locked');
    o.addEventListener('click', ()=> roomAnswer(i, q, opts));
    opts.appendChild(o);
  });
  card.appendChild(opts);
  wrap.appendChild(card);

  const mini = el('div','card');
  mini.style.padding='14px 18px';
  const sorted = state.roomPlayers.slice(0,3);
  const rowline = el('div','muted','En cabeza: ' + (sorted.map(p=>p.name+' ('+p.score+')').join(' · ') || '—'));
  mini.appendChild(rowline);
  wrap.appendChild(mini);
  roomGameLeaderboardEl = rowline;

  app.appendChild(wrap);

  function tick(){
    const elapsed = (Date.now() - meta.questionStartTime)/1000;
    const pct = Math.max(0, Math.min(100, ((QUESTION_TIME - elapsed)/QUESTION_TIME)*100));
    timerBar.style.width = pct + '%';
    if(elapsed < QUESTION_TIME + 1.5){
      roomTimerRAF = requestAnimationFrame(tick);
    }
  }
  tick();
}

function updateRoomGameLive(){
  if(!roomGameHudScoreEl || !roomGameLeaderboardEl) return;
  const me = state.roomPlayers.find(p=>p.id===state.myId) || {score:0};
  roomGameHudScoreEl.textContent = '⭐ ' + me.score;
  const sorted = state.roomPlayers.slice(0,3);
  roomGameLeaderboardEl.textContent = 'En cabeza: ' + (sorted.map(p=>p.name+' ('+p.score+')').join(' · ') || '—');
}

async function roomAnswer(choice, q, optsEl){
  if(state.myAnswered) return;
  state.myAnswered = true;
  const elapsed = (Date.now() - state.roomMeta.questionStartTime)/1000;
  const buttons = optsEl.querySelectorAll('.option');
  buttons.forEach((b,i)=>{
    b.classList.add('locked');
    if(i===q.a) b.classList.add('correct');
    else if(i===choice) b.classList.add('wrong');
  });
  const correct = choice===q.a;
  const pts = pointsForAnswer(correct, elapsed);
  if(correct) burstConfetti();
  const me = state.roomPlayers.find(p=>p.id===state.myId);
  const newScore = (me ? me.score : 0) + pts;
  try{
    await window.storage.set('room:'+state.roomCode+':players:'+state.myId, JSON.stringify({id:state.myId, name:state.myName, score:newScore, answeredQ: state.roomMeta.currentQuestion}), true);
  }catch(e){ /* ignore */ }
}

function renderRoomResults(){
  if(roomTimerRAF) cancelAnimationFrame(roomTimerRAF);
  const wrap = el('div','screen');
  wrap.appendChild(el('div','result-emoji','🏁'));
  wrap.appendChild(el('h2','center','¡Partida terminada!'));

  const card = el('div','card');
  card.appendChild(el('h3','','Marcador final'));
  const list = el('div','');
  list.style.marginTop='10px';
  const ranked = state.roomPlayers.slice().sort((a,b)=>b.score-a.score);
  ranked.forEach((p,i)=>{
    const row = el('div','player-row');
    const nameWrap = el('div','name');
    const av = el('div','avatar', (i<3?['🥇','🥈','🥉'][i]:initials(p.name)));
    av.className = 'avatar ' + (i===0?'rank-1':i===1?'rank-2':i===2?'rank-3':'');
    if(i>2) av.style.background = colorFor(p.id);
    nameWrap.appendChild(av);
    nameWrap.appendChild(document.createTextNode(p.name));
    row.appendChild(nameWrap);
    row.appendChild(el('div','pts', p.score+' pts'));
    list.appendChild(row);
  });
  card.appendChild(list);
  wrap.appendChild(card);

  if(state.isHost){
    const again = el('button','btn','🔁 Nueva partida (misma sala)');
    again.addEventListener('click', async ()=>{
      const cat = state.roomMeta.category;
      const subKey = state.roomMeta.subcategory;
      const count = state.roomMeta.questions.length;
      const questions = shuffle(pool(cat, subKey)).slice(0,count);
      const resetMeta = {...state.roomMeta, status:'lobby', currentQuestion:-1, questionStartTime:null, questions};
      await window.storage.set('room:'+state.roomCode+':meta', JSON.stringify(resetMeta), true);
      for(const p of state.roomPlayers){
        await window.storage.set('room:'+state.roomCode+':players:'+p.id, JSON.stringify({...p, score:0}), true);
      }
      pollRoom();
    });
    wrap.appendChild(again);
  }

  const home = el('button','btn secondary','🏠 Volver al inicio');
  home.addEventListener('click', goHome);
  wrap.appendChild(home);

  app.appendChild(wrap);
  const winner = state.roomPlayers.slice().sort((a,b)=>b.score-a.score)[0];
  if(winner && winner.id===state.myId) burstConfetti();
}

/* ---------------------------------------------------------
   Confeti
--------------------------------------------------------- */
function burstConfetti(){
  const colors = ['#8CFF6B','#FFC93C','#FF4FA3','#34D2FF','#B98CFF'];
  for(let i=0;i<28;i++){
    const p = document.createElement('div');
    p.className = 'confetti-piece';
    p.style.left = Math.random()*100 + 'vw';
    p.style.background = colors[Math.floor(Math.random()*colors.length)];
    p.style.animationDuration = (1.6 + Math.random()*1.2) + 's';
    p.style.opacity = 0.9;
    document.body.appendChild(p);
    setTimeout(()=> p.remove(), 3200);
  }
}

render();
